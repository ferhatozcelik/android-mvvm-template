plugins {
    // Kotlin support is built into the Android Gradle Plugin since AGP 9.0, so the
    // `org.jetbrains.kotlin.android` plugin is intentionally NOT applied anymore.
    // See https://kotl.in/gradle/agp-built-in-kotlin
    alias(libs.plugins.com.android.application) apply false
    alias(libs.plugins.com.android.library) apply false
    alias(libs.plugins.com.google.dagger.hilt.android) apply false
    alias(libs.plugins.androidx.navigation.safeargs) apply false
    alias(libs.plugins.org.jetbrains.kotlin.parcelize) apply false
    alias(libs.plugins.com.google.devtools.ksp) apply false
    // alias(libs.plugins.com.google.gms.google.services) apply false // Google Play Services
    // alias(libs.plugins.com.google.firebase.crashlytics) apply false // Google Play Services
}

ext {
    // NOTE: bumped to 37 (instead of the originally requested 36) because
    // androidx.core:core-ktx 1.19.0 and Glide 5.0.9 require compiling against API 37+.
    appCompileSdkVersion = 37
    appTargetSdkVersion = 37
    appMinSdkVersion = 24
}
