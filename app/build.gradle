plugins {
    // Kotlin support is provided by AGP's built-in Kotlin (since AGP 9.0), so the
    // `org.jetbrains.kotlin.android` plugin is intentionally NOT applied here.
    // See https://kotl.in/gradle/agp-built-in-kotlin
    alias(libs.plugins.com.android.application)
    alias(libs.plugins.androidx.navigation.safeargs)
    alias(libs.plugins.com.google.dagger.hilt.android)
    alias(libs.plugins.com.google.devtools.ksp)
    alias(libs.plugins.org.jetbrains.kotlin.parcelize)
    // id("com.google.gms.google-services") // Google Play Services
    // id("com.google.firebase.crashlytics") // Google Play Services
}
hilt {
    enableAggregatingTask = true
}
configurations.configureEach {
    resolutionStrategy {
        // Hilt's annotation processor still ships against an older kotlin-metadata-jvm
        // baseline than Kotlin 2.4.x produces; force the newer artifact so it can parse
        // Kotlin 2.4.20 metadata. Safe to remove once Hilt bumps this internally.
        force 'org.jetbrains.kotlin:kotlin-metadata-jvm:2.4.20'
    }
}
android {
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
    compileSdk appCompileSdkVersion
    namespace "com.ferhatozcelik.androidmvvmtemplate"
    defaultConfig {
        applicationId "com.ferhatozcelik.androidmvvmtemplate"
        minSdkVersion appMinSdkVersion
        targetSdkVersion appTargetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

}
dependencies {

    // Kotlin
    implementation(libs.kotlin.stdlib)
    implementation(libs.core.ktx)
    implementation(libs.appcompat)

    // Material Design 3
    implementation(libs.material)
    implementation(libs.androidx.viewpager2)

    // ConstraintLayout
    implementation(libs.constraintlayout)

    // Fragment
    implementation(libs.fragment)

    // RecyclerView
    implementation(libs.recyclerview)

    // DeSugar Use Java 8+ language features and APIs
    coreLibraryDesugaring(libs.desugar.jdk.libs)

    // Dagger Hilt
    implementation(libs.hilt)
    ksp(libs.hilt.compiler)

    // Room
    implementation(libs.room)
    implementation(libs.room.runtime)
    ksp(libs.room.compiler)

    // Coroutines
    implementation(libs.kotlinx.coroutines.core)
    implementation(libs.kotlinx.coroutines.android)

    // Lifecycle (ViewModel + StateFlow support)
    implementation(libs.lifecycle)
    implementation(libs.lifecycle.runtime)

    // Retrofit
    implementation(libs.retrofit)
    implementation(libs.converter.gson)
    implementation(libs.logging.interceptor)

    // Navigation
    implementation(libs.navigation)
    implementation(libs.navigation.ui)

    // Glide
    implementation(libs.glide)
    ksp(libs.glide.ksp)

    // Firebase
    // implementation(libs.firebase)
    // implementation(libs.analytics)
    // implementation(libs.crashlytics)

    // Testing
    testImplementation(libs.junit)
    testImplementation(libs.kotlinx.coroutines.test)
    androidTestImplementation(libs.androidx.test.ext.junit)
    androidTestImplementation(libs.espresso.core)

}
